name: ugazee

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ugazee-web:latest
    container_name: ugazee-web
    restart: unless-stopped
    init: true
    ports:
      # Bound to loopback by default; nginx on the host proxies to it.
      # Override with BIND_ADDR=0.0.0.0 HOST_PORT=3000 to expose directly.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
