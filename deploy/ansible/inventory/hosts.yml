---
all:
  hosts:
    ugazee:
      ansible_host: 38.86.78.92
      ansible_user: root
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=accept-new
        -o ConnectTimeout=15
  vars:
    # Upstream port the container listens on inside the host network namespace.
    host_port: 3000
    # 127.0.0.1 keeps the app private behind the host nginx; use 0.0.0.0 to expose directly.
    bind_addr: 127.0.0.1

    # Deploy knobs (override with -e on the command line).
    # Path on the control node to a `docker save` tarball. When set, the image is
    # transferred and loaded instead of being built on the server.
    image_archive: ""
    create_swap: false

    # Optional nginx vhost (off: the host already front 443 for NetBird).
    manage_nginx: false
    server_name: "_"

    # prune-docker.yml knobs.
    prune_age: "24h"
    prune_volumes: false
